<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 情绪花园 — 数字沙盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #fff;
    text-align: center;
  }
  .loader {
    animation: pulse 1.5s ease-in-out infinite;
  }
  .loader h1 { font-size: 48px; margin-bottom: 16px; }
  .loader p { font-size: 18px; opacity: 0.8; }
  .loader .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 32px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .redirect { margin-top: 24px; font-size: 14px; opacity: 0.5; }
</style>
<meta http-equiv="refresh" content="0;url=情绪花园_数字沙盘.html">
</head>
<body>
  <div class="loader">
    <h1>🌱</h1>
    <p>加载 情绪花园 中...</p>
    <div class="spinner"></div>
    <div class="redirect">正在跳转到沙盘应用</div>
  </div>
</body>
</html>
